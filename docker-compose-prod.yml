services:
  nginx:
    container_name: ${PREFIX}-nginx
    image: nginx:1.31.6
    restart: unless-stopped
    privileged: true
    ports:
      - '80:80'
      - '443:443'
    networks:
      default:
        aliases:
          - ${TESS_BASE_HOST}
    environment:
      TESS_BASE_HOST: ${TESS_BASE_HOST}
    volumes:
      - ./nginx:/etc/nginx
      - ./docker/nginx-certbot-entrypoint.sh:/usr/local/bin/nginx-certbot-entrypoint:ro
      - ./certbot/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - uploads:/TeSS/public/system:ro
      - puma-socket:/run/puma
    depends_on:
      - app
    command: ["/bin/sh", "/usr/local/bin/nginx-certbot-entrypoint"]
  certbot:
    container_name: ${PREFIX}-certbot
    image: certbot/certbot:v5.9.0
    restart: unless-stopped
    environment:
      TESS_BASE_HOST: ${TESS_BASE_HOST}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
    volumes:
      - ./docker/certbot-entrypoint.sh:/usr/local/bin/certbot-entrypoint:ro
      - ./certbot/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: ["/bin/sh", "/usr/local/bin/certbot-entrypoint"]
    depends_on:
      - nginx
  app:
    container_name: ${PREFIX}-app
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: ${PREFIX}-app
    restart: always
    healthcheck:
      test: curl --fail --silent --show-error --unix-socket /run/puma/puma.sock http://localhost/up
      interval: 5s
      timeout: 300s
    env_file: .env
    depends_on:
      - db
      - solr
      - redis
    volumes:
      - uploads:/code/public/system
      - logs:/code/log
      - tmp:/code/tmp
      - puma-socket:/run/puma
      - ./config/tess.yml:/code/config/tess.yml
      - ./config/secrets.yml:/code/config/secrets.yml
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: 'true'
      RAILS_SERVE_STATIC_FILES: 'true'
      PUMA_SOCKET: /run/puma/puma.sock
  db:
    container_name: ${PREFIX}-db
    logging:
      driver: none
    image: postgres:18.6
    restart: always
    env_file: .env
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
    volumes:
      - db-data:/var/lib/postgresql/data
  solr:
    container_name: ${PREFIX}-solr
    image: solr:8
    restart: always
    volumes:
      - solr-data:/var/solr
      - ./solr:/opt/solr/server/solr/configsets/production
    command:
      - solr-precreate
      - tess
      - /opt/solr/server/solr/configsets/production
  redis:
    container_name: ${PREFIX}-redis
    image: redis:7
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - redis-data:/data
  sidekiq:
    container_name: ${PREFIX}-sidekiq
    image: ${PREFIX}-app
    restart: always
    healthcheck:
      test: bundle exec sidekiqmon | grep $(hostname)
    depends_on:
      - app
      - db
      - redis
    volumes:
      - uploads:/code/public/system
      - tmp:/code/tmp
      - ./config/tess.yml:/code/config/tess.yml
      - ./config/secrets.yml:/code/config/secrets.yml
    env_file: .env
    environment:
      RAILS_ENV: production
    command: bundle exec sidekiq
  dbbackups:
    container_name: ${PREFIX}-dbbackups
    image: kartoza/pg-backup:18-3.6
    volumes:
      - db-backups:/backups
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASS=${DB_PASSWORD}
      - DBLIST=${DB_NAME}
      - REMOVE_BEFORE=7
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
volumes:
  db-data:
  db-backups:
  solr-data:
  redis-data:
  uploads:
  logs:
  tmp:
  puma-socket:
